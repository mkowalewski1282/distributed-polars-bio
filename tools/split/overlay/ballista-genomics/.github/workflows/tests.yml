name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # No debug info (Cargo.toml already has debug = false; this guards against a profile change).
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      # Rust from rust-toolchain.toml (before the cache: the cache key includes the rustc version).
      - name: Rust toolchain
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build binaries
        run: cargo build --bins --locked

      # Rust unit tests (among others: the mandatory coordinate convention of the dist_* operations).
      - name: Rust unit tests
        run: cargo test --lib --locked

      - name: Disk usage
        run: df -h / && du -sh target

      # uv 0.12.22 exactly (pyproject.toml accepts any 0.12.x from 0.12.22 on).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-python: true

      - name: Python environment
        run: uv sync --locked

      # Integration tests: the binaries against polars-bio on the test data (no real data in CI).
      - name: Tests (without real data)
        run: uv run --locked pytest -m "not real_data" -ra
