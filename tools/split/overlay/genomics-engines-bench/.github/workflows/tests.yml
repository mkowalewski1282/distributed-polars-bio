name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # No debug info (the Ballista Cargo.toml already has debug = false; this guards against a
      # profile change).
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Rust from the Ballista submodule's rust-toolchain.toml (before the cache: the cache key
      # includes the rustc version).
      - name: Rust toolchain
        working-directory: engines/ballista-genomics
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/ballista-genomics -> target
          cache-on-failure: true

      # Debug binaries: the tests run them on small data; measurements use release builds.
      - name: Build Ballista binaries
        working-directory: engines/ballista-genomics
        run: cargo build --bins --locked

      - name: Disk usage
        run: df -h / && du -sh engines/ballista-genomics/target

      # uv 0.12.22 exactly (pyproject.toml accepts any 0.12.x from 0.12.22 on).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-python: true

      - name: Python environment
        run: uv sync --locked

      # Correctness only, never measurements. Tests marked parallelism(p) are skipped when the
      # runner has fewer CPUs outside the system core (4 vCPUs -> P <= 2).
      - name: Tests (without real data)
        run: uv run --locked pytest -m "not real_data" -ra
