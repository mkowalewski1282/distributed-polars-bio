name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The uv version comes from required-version in pyproject.toml.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-python: true

      - name: Python environment
        run: uv sync --locked

      - name: Tests
        run: uv run --locked pytest -ra
