# Control-run noise study: the control task (overlap 7-0, polars-bio with 2 threads on both
# hardware threads of the first core outside the system core) measured 20 times in a row at the
# start of the only block. The sample is the control runs, because the control variant differs
# from the series variants; the (polars-bio, P = 1) block is only a carrier. The result is
# evaluated with:
#   uv run python -m bench.control_noise bench/results/control-noise/<timestamp>
# A measurement series — run it only on an idle machine with empty swap (see README, Run protocol).
series: control-noise
scenarios:
  - {op: overlap, pair: "7-0"}
variants: [polars_bio]
parallelism: [1]
repeats: 1
warmup: 1
# The 20 control runs at the start of the block are the study sample (bench.control_noise takes
# only those from the start); the same number is run at the end of the block.
control_repeats: 20
# The block's own drift check must not discard the noise sample: the study itself evaluates the
# 10% threshold (as in the integration tests).
control_tolerance: 100.0
seed: 20261009
# Pause before every run: lets WSL2 return memory to the host, which reduces control-run noise.
settle_s: 3.0
