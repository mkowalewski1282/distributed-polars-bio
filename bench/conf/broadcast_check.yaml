# Check of the broadcast cells: nearest and coverage on 2-7 and 7-0 in Ballista at
# P = 1, 2, 4, 8 — completion under the 512 MiB gRPC limit, broadcast_bytes and peak memory.
# Each of the P executors holds its own copy of the broadcast table, so memory is tightest at
# P = 8.
# A measurement series — run it only on an idle machine with empty swap (see README, Run protocol).
series: broadcast-check
scenarios:
  - {op: nearest, pair: "2-7"}
  - {op: coverage, pair: "2-7"}
  - {op: nearest, pair: "7-0"}
  - {op: coverage, pair: "7-0"}
variants: [ballista]
parallelism: [1, 2, 4, 8]
repeats: 1
warmup: 0
control_repeats: 3
# The series checks completion, broadcast_bytes and memory, not time; a drift check would only repeat the expensive 7-0 blocks.
control_tolerance: 100.0
# A hang should cost 10 minutes, not 20.
timeout_s: 600
# EXPLAIN ANALYZE plans with operator metrics — index build time per task.
explain: true
seed: 20261009
# Pause before every run: lets WSL2 return memory to the host, which reduces control-run noise.
settle_s: 3.0
