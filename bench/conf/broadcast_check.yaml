# Sprawdzenie komórek z broadcastem (specyfikacja 3b-2, sekcja 9, punkt 5): nearest i coverage
# na 2-7 i 7-0 w Ballistcie przy P = 1, 2, 4, 8 — ukończenie przy limicie gRPC 512 MiB,
# broadcast_bytes i szczyt pamięci (dane wejściowe także dla kalibracji w 3b-3). Każdy z P
# executorów trzyma własną kopię tabeli rozsyłanej, więc przy P = 8 pamięć jest najciaśniejsza.
# Seria pomiarowa — tylko po checkliście RAM (zamknięty VS Code, pusty swap).
series: broadcast-check
scenarios:
  - {op: nearest, pair: "2-7"}
  - {op: coverage, pair: "2-7"}
  - {op: nearest, pair: "7-0"}
  - {op: coverage, pair: "7-0"}
variants: [ballista]
parallelism: [1, 2, 4, 8]
repeats: 1
warmup: 0
control_repeats: 3
# Seria sprawdza ukończenie, broadcast_bytes i pamięć, nie czas; dryf tylko powtarzałby drogie bloki 7-0.
control_tolerance: 100.0
# Zawieszenie ma kosztować 10 minut, nie 20.
timeout_s: 600
# Plany EXPLAIN ANALYZE z metrykami operatorów (spec 3b-2, 6.4) — czas budowy indeksu na zadanie.
explain: true
seed: 20261009
# Przerwa przed każdym przebiegiem: zwracanie pamięci WSL2 do Hyper-V (Zadanie 27, badanie szumu).
settle_s: 3.0
