# Seria skalowania (etap 4, specyfikacja 8.2; semantyka P): warianty polars_bio, ballista i sail
# przy P = 1, 2, 4 i 8 CPU, na parach 2-7 i 7-0 oraz zbiorach 7 i 0. Główna seria pomiarowa etapu 4
# (smoke.yaml służy tylko do sprawdzenia poprawności):
#   uv run python -m bench.orchestrator bench/conf/scaling.yaml
# Raport (tabela median i wykresy od P): uv run python -m bench.report bench/results/scaling/<czas>
#
# Rachunek czasu (przebiegi liczone z kodu bench/orchestrator.py, run_block):
#   blok = 2·10 kontroli (controls("start") i controls("end"), control_repeats = 10)
#        + 1 rozgrzewka × 10 scenariuszy
#        + 5 rund × 10 scenariuszy (repeats = 5)
#        = 2·10 + 10 scenariuszy × 6 = 80 przebiegów
#   12 bloków (3 warianty × 4 wartości P) × 80 = 960 przebiegów + 10 wzorców (przebiegi referencyjne
#   polars-bio na 1 partycji, po jednym na scenariusz; przebieg kontrolny overlap 7-0 jest już
#   wśród scenariuszy, więc nie dokłada wzorca).
#   ~5,5 s na przebieg (czas 0,2–3 s + ~1 s startu + 3 s settle_s) ≈ 1,5 h.
#   Z powtórzeniem każdego bloku po dryfie przebiegu kontrolnego ≤ 3 h (limit 4 h).
series: scaling
scenarios:
  - {op: overlap, pair: "2-7"}
  - {op: nearest, pair: "2-7"}
  - {op: coverage, pair: "2-7"}
  - {op: subtract, pair: "2-7"}
  - {op: overlap, pair: "7-0"}
  - {op: nearest, pair: "7-0"}
  - {op: coverage, pair: "7-0"}
  - {op: subtract, pair: "7-0"}
  - {op: merge, dataset: 7}
  - {op: merge, dataset: 0}
variants: [polars_bio, ballista, sail]
parallelism: [1, 2, 4, 8]
repeats: 5
warmup: 1
control_repeats: 10
# Przerwa przed każdym przebiegiem: zwracanie pamięci WSL2 do Hyper-V (Zadanie 27, badanie szumu).
settle_s: 3.0
seed: 20261115
