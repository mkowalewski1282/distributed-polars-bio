[package]
name = "ballista_genomics"
version = "0.1.0"
edition = "2024"

[dependencies]
ballista = { version = "53.0.0", features = ["standalone"] }
# Zadanie P0: własne procesy schedulera i executora (binarka ballista_node).
# Te crate'y i tak są już kompilowane przez `ballista` (cecha standalone),
# z domyślnymi cechami — bezpośrednia zależność z tymi samymi cechami nie
# wymusza ponownej kompilacji ani pobierania.
ballista-core = "53.0.0"
ballista-scheduler = "53.0.0"
ballista-executor = "53.0.0"
# Logi węzłów na stderr; wersja i cecha env-filter jak u ballista-scheduler.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
datafusion = "=53.0.0"
datafusion-proto = "53"
# Lokalna, załatana kopia (jedna linijka widoczności: mod -> pub mod) — patrz
# vendor/PATCH.md. Potrzebna do PhysicalExtensionCodec dla IntervalJoinExec (Faza A.4b).
datafusion-bio-function-ranges = { path = "vendor/datafusion-bio-function-ranges" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
prost = "0.14"

# Środowisko ma tylko 3.5GB RAM — linkowanie tej binarki (Ballista scheduler+executor
# + cały DataFusion + bio-function-ranges) z pełnym debug info (-C debuginfo=2)
# wykańczało swap i groziło ponownym zawieszeniem WSL (patrz OPIS.md). Wyłączenie
# debug info drastycznie zmniejsza zużycie pamięci przez linker (rust-lld).
[profile.dev]
debug = false
