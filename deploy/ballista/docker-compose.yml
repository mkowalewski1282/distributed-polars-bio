# Lokalny klaster Ballista jako OSOBNE PROCESY/kontenery.
#
# Po co, skoro testy juz przechodza: dotychczasowe wyniki pochodza z trybu
# `standalone` (scheduler + executor w JEDNYM procesie). Plan jest tam realnie
# serializowany i przechodzi przez shuffle, ale nie przez prawdziwa siec.
# Ten plik jest krokiem posrednim miedzy standalone a GCP: lapie bledy
# pakowania i konfiguracji sieci lokalnie, czyli tanio.
#
# Uruchomienie:
#   docker compose -f deploy/ballista/docker-compose.yml up --build
#
# UWAGA: zbudowanie obrazu wymaga kompilacji Rusta. Na maszynie 3.5 GB RAM
# uzyj: docker compose build --build-arg CARGO_JOBS=1

services:
  scheduler:
    build:
      context: ../..
      dockerfile: deploy/ballista/Dockerfile
      args:
        CARGO_JOBS: ${CARGO_JOBS:-0}
    image: ballista-genomics:latest
    command: ["--help"]
    ports:
      - "50050:50050"   # gRPC schedulera
      - "50051:50051"   # UI schedulera
    volumes:
      - ../../ballista_genomics/output:/app/output

  executor-1:
    image: ballista-genomics:latest
    depends_on: [scheduler]
    command: ["--help"]
    volumes:
      - ../../ballista_genomics/output:/app/output

  executor-2:
    image: ballista-genomics:latest
    depends_on: [scheduler]
    command: ["--help"]
    volumes:
      - ../../ballista_genomics/output:/app/output

# Stan (P0, wrzesień 2026): tryb klastra z osobnych procesów jest zaimplementowany
# i przetestowany NATYWNIE (bez Dockera) — binarka `ballista_node` (role
# `scheduler` i `executor`) oraz klient `dist_ops` ze zmienną
# BALLISTA_SCHEDULER_URL; instrukcja: ballista_genomics/OPIS.md, sekcja P0.
# Komendy `--help` powyżej trzeba zastąpić wywołaniami `ballista_node`
# z tymi samymi flagami; ten plik NIE był jeszcze uruchamiany. Uwaga: ładunki
# planu przenoszą ścieżki do danych, więc kontenery muszą widzieć dane pod tą
# samą ścieżką (wspólny wolumen).
